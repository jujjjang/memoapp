<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>생각의 방</title>
<meta name="description" content="방 안의 서랍, 상자, 코르크보드, 스크랩북에 생각을 넣어 정리하는 메모 앱">
<meta name="theme-color" content="#ECE2D5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="생각의 방">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&family=Gaegu:wght@700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@800&text=%EC%83%9D%EA%B0%81%EC%9D%98%20%EB%B0%A9&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.97.0"></script>
<script src="config.js"></script>
<style>
/* Layout: a flat, beige living-room illustration fills the screen; furniture opens full sheets; memos nest their 생각 조각 as boxes inside */
:root{
  --bg:#F4EFE8;--surface:#FFFDF9;--chip:#ECE4D9;--line:#E4DACD;--ink:#3A332D;--muted:#857A6F;
  --wash-a:#EEE5D9;--wash-b:#F2ECE3;--wash-c:#F4EFE8;--navbg:rgba(244,239,232,.92);
  --accent:#A86A50;--accent-2:#8FA58E;--on-accent:#FFFFFF;--danger:#B3402E;--nest:#F8F3EC;
  --n1:#F3E4C0;--n2:#DDE6D8;--n3:#F1DCD5;--n4:#DFE5EA;
  --cork:#D6B78F;--cork-dot:#C4A47B;--wood:#E3CDB0;--photo:#FFFFFF;--photo-ink:#3A332D;--photo-line:#DCD2C5;--tape:#CFDCC9;
  --shadow:rgba(80,60,40,.2);--scrim:rgba(40,30,20,.42);
  --font-title:"Gowun Batang","Nanum Myeongjo","AppleMyungjo",serif;
  --font-logo:"Noto Serif KR","Gowun Batang","Nanum Myeongjo","AppleMyungjo",serif;
  --font-ko:"Gowun Dodum","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  --font-mono:"Gowun Dodum","Apple SD Gothic Neo",system-ui,sans-serif;
  --font-hand:"Gaegu","Nanum Pen Script",cursive;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1D1A17;--surface:#28241F;--chip:#332E28;--line:#3B352E;--ink:#EEE6DC;--muted:#A99D90;
  --wash-a:#24201C;--wash-b:#201D19;--wash-c:#1D1A17;--navbg:rgba(29,26,23,.92);
  --accent:#D99A7E;--accent-2:#9DB49C;--on-accent:#1D1A17;--danger:#EE8A74;--nest:#221F1B;
  --n1:#3D3624;--n2:#2B3529;--n3:#3D2D29;--n4:#2A3036;
  --cork:#7E6347;--cork-dot:#6A523A;--wood:#8D7255;--photo:#EFE8DE;--photo-ink:#3A332D;--photo-line:#CFC4B6;--tape:#7F9A82;
  --shadow:rgba(0,0,0,.5);--scrim:rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1D1A17;--surface:#28241F;--chip:#332E28;--line:#3B352E;--ink:#EEE6DC;--muted:#A99D90;
  --wash-a:#24201C;--wash-b:#201D19;--wash-c:#1D1A17;--navbg:rgba(29,26,23,.92);
  --accent:#D99A7E;--accent-2:#9DB49C;--on-accent:#1D1A17;--danger:#EE8A74;--nest:#221F1B;
  --n1:#3D3624;--n2:#2B3529;--n3:#3D2D29;--n4:#2A3036;
  --cork:#7E6347;--cork-dot:#6A523A;--wood:#8D7255;--photo:#EFE8DE;--photo-ink:#3A332D;--photo-line:#CFC4B6;--tape:#7F9A82;
  --shadow:rgba(0,0,0,.5);--scrim:rgba(0,0,0,.6);color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--font-ko);font-size:15px;line-height:1.55;word-break:keep-all;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- buttons ---------- */
.btn{font:inherit;font-size:13px;font-weight:500;line-height:1;min-height:36px;padding:0 12px;border-radius:9px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:6px;flex:none}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.danger{color:var(--danger)}
.btn.armed{background:var(--danger);border-color:var(--danger);color:var(--surface)}
.btn.icon{width:40px;padding:0}
.btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* ---------- home: the room fills the screen (one look in both themes) ---------- */
.stage{position:fixed;inset:0;background:#ECE2D5;overflow:hidden}
#room{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud{position:fixed;top:0;left:0;right:0;z-index:2;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;pointer-events:none;
  padding-top:calc(env(safe-area-inset-top,0px) + 42px);padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hud>*{pointer-events:auto}
h1{font-family:var(--font-logo);font-weight:800;font-size:34px;line-height:1.1;margin:0;color:#3A332D;letter-spacing:-.02em}
.dates{font-family:var(--font-mono);font-size:12px;color:#8A7D70;letter-spacing:.04em;margin-top:5px;font-variant-numeric:tabular-nums}
.note{display:inline-block;margin:8px 0 0;font-size:12px;color:#6F6357;background:rgba(255,253,249,.8);border-radius:999px;padding:3px 10px}
.round{width:44px;height:44px;border-radius:50%;border:0;display:grid;place-items:center;background:rgba(255,253,249,.92);color:#3A332D;box-shadow:0 6px 16px -8px rgba(90,65,40,.45)}
.round svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.fab{position:fixed;z-index:3;right:max(20px,calc(env(safe-area-inset-right,0px) + 20px));bottom:calc(env(safe-area-inset-bottom,0px) + 24px);
  width:60px;height:60px;border-radius:50%;border:0;display:grid;place-items:center;background:#A86A50;color:#FFFFFF;box-shadow:0 14px 24px -10px rgba(120,70,45,.6)}
.fab svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round}
.fab:active{transform:scale(.95)}
.fab:focus-visible,.round:focus-visible{outline:2px solid #3A332D;outline-offset:3px}

/* ---------- room drawing ---------- */
.furn{cursor:pointer;outline:none;transition:transform .14s ease-out,filter .15s;transform-box:fill-box;transform-origin:center}
.furn .tap{fill:transparent}
.furn:hover,.furn:focus-visible{filter:drop-shadow(0 0 6px rgba(168,106,80,.4))}
.furn:focus-visible .tap{stroke:#A86A50;stroke-width:1.2;stroke-dasharray:4 5}
.furn.pressed{transform:translateY(3px)}
.furn.bump{animation:bump .55s ease-out}
@keyframes bump{0%{transform:none}30%{transform:translateY(-6px) rotate(-1.5deg)}60%{transform:translateY(1px) rotate(1deg)}100%{transform:none}}
.pill rect{fill:rgba(255,253,249,.94)}
.pill text{font-family:var(--font-title);font-size:11.5px;font-weight:700;fill:#9C8470}
.pill .pn{fill:#A86A50}
.dl{font-family:var(--font-title);font-size:10px;font-weight:700;fill:#6B5B4D;text-anchor:middle}
.dc{font-family:var(--font-title);font-size:11px;font-weight:700;fill:#FFFFFF;text-anchor:middle}
.bl{font-family:var(--font-hand);font-size:12.5px;font-weight:700;fill:#8A6A4E;text-anchor:middle}

/* ---------- layers ---------- */
.layer{position:fixed;inset:0;z-index:10;overflow-y:auto;overscroll-behavior:contain;padding-bottom:env(safe-area-inset-bottom,0px);
  background:linear-gradient(180deg,var(--wash-a) 0,var(--wash-b) 320px,var(--wash-c) 700px) var(--bg);animation:rise .22s ease-out}
#search{z-index:15}#editor{z-index:20}
@keyframes rise{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
.bar{position:sticky;top:0;z-index:3;background:var(--navbg);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top,0px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar-in{max-width:620px;margin:0 auto;display:flex;align-items:center;gap:8px;min-height:56px}
.sp{flex:1}
.layer-in{max-width:620px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.p-head{margin-bottom:16px}
.p-head h2{font-family:var(--font-title);font-weight:700;font-size:30px;line-height:1.15;margin:0;text-wrap:balance}
.p-head p{margin:4px 0 0;color:var(--muted);font-size:14px}
.empty{color:var(--muted);font-size:14px;margin:18px 0;max-width:36ch}

/* drawer tabs and names */
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.seg button{display:grid;gap:1px;justify-items:start;text-align:left;padding:9px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);min-width:0}
.seg .s-name{font-family:var(--font-title);font-size:13px;font-weight:700;line-height:1.3;max-width:100%;overflow-wrap:anywhere}
.seg .s-sub{font-size:12px;color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg button[aria-selected="true"] .s-sub{color:var(--bg);opacity:.75}
.rename{display:flex;justify-content:flex-end;margin:6px 0 12px}
.names{display:grid;gap:10px;margin-bottom:16px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.names b{font-family:var(--font-title);font-weight:700;font-size:16px}
.names label{display:grid;grid-template-columns:64px minmax(0,1fr);align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.names input{font:inherit;font-size:16px;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);min-width:0;width:100%}
.names .row{display:flex;justify-content:flex-end;gap:6px}

/* cards with nested 생각 조각 */
.cards{display:grid;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;min-width:0}
.card-main{display:grid;gap:3px;width:100%;text-align:left;border:0;background:transparent;padding:13px 14px;min-width:0}
.c-title{font-family:var(--font-title);font-size:16px;font-weight:700;line-height:1.4;overflow-wrap:anywhere}
.c-title.none,.n-title.none{color:var(--muted)}
.c-pre{font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere;white-space:pre-wrap}
.c-meta{font-family:var(--font-mono);font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.nest{display:grid;gap:8px;padding:0 12px 12px}
.nbox{display:grid;gap:2px;text-align:left;width:100%;min-width:0;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--nest);color:var(--ink);transition:border-color .3s}
.n-title{font-family:var(--font-title);font-size:14.5px;font-weight:700;overflow-wrap:anywhere}
.n-pre{font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.nbox.flash{border-color:var(--accent)}
.pile{box-shadow:0 5px 0 -1px var(--surface),0 5px 0 0 var(--line),0 10px 0 -2px var(--surface),0 10px 0 -1px var(--line);margin-bottom:10px}
.res-place{font-family:var(--font-title);font-size:12.5px;font-weight:700;color:var(--muted)}

/* box: sticky notes */
.notes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 14px}
@media (min-width:560px){.notes{grid-template-columns:repeat(3,minmax(0,1fr))}}
.sticky{display:flex;flex-direction:column;gap:5px;text-align:left;min-width:0;min-height:112px;padding:14px 13px 12px;border:0;border-radius:3px 3px 14px 3px;
  background:var(--nc,var(--n1));color:var(--ink);transform:rotate(var(--r,0deg));box-shadow:0 10px 14px -12px var(--shadow)}
.sticky .c-title{font-size:15px}
.sticky .c-pre{-webkit-line-clamp:3;color:var(--ink);opacity:.72}
.sticky .c-meta{margin-top:auto}

/* cork board: photos pinned in a grid, a title under each */
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px 12px;align-content:start;padding:24px 14px 26px;min-height:min(52vh,460px);
  background-color:var(--cork);background-image:radial-gradient(var(--cork-dot) 1px,transparent 1.6px),radial-gradient(var(--cork-dot) .8px,transparent 1.3px);
  background-size:9px 9px,13px 13px;background-position:0 0,4px 6px;border:9px solid var(--wood);border-radius:16px;box-shadow:inset 0 2px 8px rgba(0,0,0,.14),0 18px 30px -24px var(--shadow)}
@media (min-width:560px){.board{grid-template-columns:repeat(4,minmax(0,1fr));gap:24px 16px;padding:28px 20px}}
.polc{position:relative;min-width:0;display:flex;flex-direction:column;gap:4px;padding:6px 6px 5px;background:var(--photo);color:var(--photo-ink);border-radius:2px;
  transform:rotate(var(--r,0deg));box-shadow:0 10px 16px -10px rgba(0,0,0,.5)}
.tape{position:absolute;top:-7px;left:50%;width:36px;height:13px;margin-left:-18px;transform:rotate(var(--tr,-3deg));opacity:.9;border-radius:1px;background:var(--tc,var(--tape))}
.pol-hit{display:block;width:100%;padding:0;border:0;background:transparent;text-align:left;color:inherit}
.pol-img{position:relative;display:block;aspect-ratio:1/1;max-width:100%;background:#EEE8DF;overflow:hidden;border-radius:1px}
.pol-img img{width:100%;height:100%;object-fit:cover;display:block}
.pol-img.busy{display:grid;place-items:center;font-size:11px;color:#8A7D70}
.more{position:absolute;right:3px;bottom:3px;background:rgba(40,32,26,.7);color:#fff;font-size:10.5px;padding:1px 6px;border-radius:8px}
.pol-txt{display:block;aspect-ratio:1/1;max-width:100%;padding:6px 4px;font-size:11px;line-height:16px;overflow:hidden;overflow-wrap:anywhere;color:var(--photo-ink);
  background-image:linear-gradient(transparent 15px,#ECE5DA 15px);background-size:100% 16px;background-position:0 6px}
.pol-line{display:block;width:100%;min-width:0;border:0;border-bottom:1px dashed transparent;background:transparent;outline:none;padding:1px 1px 2px;text-align:center;
  font-family:var(--font-hand);font-weight:700;font-size:16px;line-height:1.2;color:var(--photo-ink);border-radius:0;text-overflow:ellipsis}
.pol-line::placeholder{color:#C2B8AC}
.pol-line:focus{border-bottom-color:#A86A50}
.polc.add{justify-content:center;align-items:center;gap:2px;min-height:96px;background:rgba(255,255,255,.24);border:2px dashed rgba(255,255,255,.85);box-shadow:none;transform:none;color:#FFFFFF;font-size:13px;font-weight:600}
.add-plus{font-size:26px;line-height:1}

/* cork board gallery: big photos side by side, a title and a comment under each */
.gal{position:fixed;inset:0;z-index:25;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.gal-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:54px;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px))}
#galCount{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.gal-strip{flex:1;min-height:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
.gal-strip::-webkit-scrollbar{display:none}
.gal-item{flex:none;width:100%;height:100%;scroll-snap-align:center;scroll-snap-stop:always;overflow-y:auto;display:flex;flex-direction:column;gap:16px;
  padding:6px max(16px,env(safe-area-inset-right,0px)) 32px max(16px,env(safe-area-inset-left,0px))}
.gal-pic{display:grid;place-items:center;min-height:0}
.gal-pic img{display:block;max-width:100%;max-height:58vh;object-fit:contain;background:var(--photo);padding:8px 8px 10px;border-radius:3px;box-shadow:0 18px 30px -20px var(--shadow)}
.gal-paper{width:min(100%,340px);aspect-ratio:1/1;background:var(--photo);color:var(--photo-ink);padding:20px;border-radius:3px;display:grid;place-items:center;text-align:center;
  font-family:var(--font-hand);font-weight:700;font-size:22px;overflow-wrap:anywhere;box-shadow:0 18px 30px -20px var(--shadow)}
.gal-text{width:100%;max-width:560px;margin:0 auto;display:grid;gap:10px}
.gal-title{width:100%;min-width:0;border:0;border-bottom:1.5px dashed var(--line);background:transparent;outline:none;padding:4px 2px 6px;
  font-family:var(--font-title);font-weight:700;font-size:20px;color:var(--ink);border-radius:0}
.gal-title:focus{border-bottom-color:var(--accent)}
.gal-title::placeholder,.gal-note::placeholder{color:var(--muted);opacity:.8;font-weight:400}
.gal-note{display:block;width:100%;min-height:76px;border:1px solid var(--line);border-radius:12px;background:var(--surface);resize:none;outline:none;padding:10px 12px;
  font:inherit;font-size:16px;line-height:1.6;color:var(--ink);overflow:hidden}
.gal-note:focus{border-color:var(--accent-2)}
.gal-ro{display:block;width:100%;text-align:left;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:10px 12px;font-size:15px;color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere}
.hint{font-size:12.5px;color:var(--muted);margin:10px 2px 0}

/* trash */
.crump{background:transparent;border:1.5px dashed var(--line);border-radius:14px;min-width:0}
.crump .c-title{color:var(--muted)}
.row-acts{display:flex;gap:6px;align-items:center;justify-content:flex-end;padding:0 10px 10px}

/* ---------- editor ---------- */
.place-chip{min-width:0;display:inline-flex;align-items:center;gap:6px;border:0;background:var(--chip);border-radius:999px;padding:6px 12px 6px 6px;font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.place-chip .dot{flex:none;width:22px;height:22px;border-radius:7px;display:grid;place-items:center;background:var(--accent);color:var(--on-accent)}
.place-chip svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.tools{min-height:48px;gap:6px;padding-bottom:8px}
.ed{padding-bottom:42vh}
.crumb{display:block;border:0;background:transparent;padding:0 0 6px;color:var(--accent);font-family:var(--font-title);font-size:14px;font-weight:700;text-align:left;overflow-wrap:anywhere}
#edTitle{display:block;width:100%;border:0;background:transparent;resize:none;outline:none;padding:0;margin:0 0 12px;color:var(--ink);
  font-family:var(--font-title);font-weight:700;font-size:28px;line-height:1.25;overflow:hidden}
#edTitle::placeholder{color:var(--muted);opacity:.6}
.phs{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 14px;margin-bottom:4px;scroll-snap-type:x proximity}
.ph{flex:none;width:128px;height:128px;padding:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--chip);scroll-snap-align:start}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph.add{display:grid;place-items:center;border:1.5px dashed var(--line);background:transparent;color:var(--muted);font-size:13px;font-weight:600}
.ph.busy{display:grid;place-items:center;font-size:12.5px;color:var(--muted);background:var(--surface)}
.blk{display:flex;gap:9px;align-items:flex-start;min-width:0}
.bt{flex:1;min-width:0;border:0;background:transparent;resize:none;outline:none;color:var(--ink);font:inherit;font-size:16px;line-height:1.7;padding:1px 0;margin:0;overflow:hidden}
.bt::placeholder{color:var(--muted);opacity:.75}
.cbox{flex:none;position:relative;width:21px;height:21px;margin-top:4px;border:1.6px solid var(--muted);border-radius:6px;background:var(--surface);padding:0}
.cbox[aria-checked="true"]{background:var(--accent);border-color:var(--accent)}
.cbox[aria-checked="true"]::after{content:"";position:absolute;left:6px;top:2px;width:5px;height:10px;border:solid var(--on-accent);border-width:0 2.2px 2.2px 0;transform:rotate(42deg)}
.blk.done .bt{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--muted)}
.numk{flex:none;min-width:22px;text-align:right;color:var(--accent);font-family:var(--font-mono);font-weight:600;font-size:14px;line-height:1.7;padding-top:3px;font-variant-numeric:tabular-nums}
.kid-list{display:grid;gap:10px;margin-top:22px}
.nbox.ed{padding:8px 6px 10px 14px;background:var(--surface)}
.nb-top{display:flex;align-items:center;gap:2px;min-width:0}
.kid-t{flex:1;min-width:0;border:0;background:transparent;outline:none;padding:4px 0;font:inherit;font-family:var(--font-title);font-size:16px;font-weight:700;color:var(--ink)}
.kid-x{display:block;width:100%;border:0;background:transparent;resize:none;outline:none;padding:0 8px 0 0;margin:0;font:inherit;font-size:16px;line-height:1.6;color:var(--ink);overflow:hidden}
.kid-t::placeholder,.kid-x::placeholder{color:var(--muted);opacity:.8;font-weight:400}
.kid-pre{display:block;width:100%;border:0;background:transparent;text-align:left;padding:0 8px 0 0;font-size:15px;color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere}
.nb-ic{flex:none;width:32px;height:32px;border:0;background:transparent;border-radius:8px;color:var(--muted);display:grid;place-items:center}
.nb-ic:hover{background:var(--chip);color:var(--ink)}
.nb-ic svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nbox.add{place-items:center;min-height:62px;border-style:dashed;background:transparent;color:var(--muted);font-family:var(--font-title);font-weight:700;font-size:15px}
.nbox:focus-within{border-color:var(--accent-2)}

/* ---------- sheet, lightbox, toast ---------- */
.scrim{position:fixed;inset:0;z-index:30;background:var(--scrim)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;max-height:84%;overflow-y:auto;background:var(--bg);border-radius:18px 18px 0 0;
  padding-top:14px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));animation:rise .18s ease-out}
.sheet>*{max-width:560px;margin-left:auto;margin-right:auto}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.sheet-head b{font-family:var(--font-title);font-weight:700;font-size:19px}
.note-s{margin:10px 0 0;font-size:13px;color:var(--muted)}
#moveList{display:grid;gap:6px;margin-top:12px}
.mv{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:11px 13px}
.mv-name{font-family:var(--font-title);font-size:15.5px;font-weight:700}
.mv-sub{font-size:12.5px;color:var(--muted);flex:1}
.mv-here{font-size:11px;font-weight:700;background:var(--accent);color:var(--on-accent);border-radius:6px;padding:3px 7px}
.mv.trash{background:transparent;border-style:dashed}
.mv.trash .mv-name{color:var(--danger)}
#q{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;font:inherit;font-size:16px;color:var(--ink)}
#lightbox{position:fixed;inset:0;z-index:40;background:#1D1A17;color:#F1EBE3;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.lb-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:54px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.lb-btn{border:0;background:transparent;color:#F1EBE3;font-size:14px;padding:8px 4px}
#lbRemove.armed{color:#FF9C84}
#lbCount{font-family:var(--font-mono);font-size:13px;opacity:.8}
#lbStrip{flex:1;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;min-height:0}
.lb-item{flex:none;width:100%;height:100%;margin:0;display:grid;place-items:center;scroll-snap-align:center;padding:8px}
.lb-item img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:50;transform:translate(-50%,16px);opacity:0;pointer-events:none;
  display:flex;align-items:center;gap:14px;max-width:calc(100% - 32px);background:var(--ink);color:var(--bg);border-radius:10px;padding:9px 14px;font-size:13.5px;transition:opacity .2s,transform .2s}
#toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{border:0;background:transparent;color:inherit;font-size:13.5px;font-weight:700;padding:0;text-decoration:underline;text-underline-offset:3px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ---------- sign in ---------- */
.auth{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:rgba(236,226,213,.6);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px}
.auth-card{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px 20px 14px;display:grid;gap:6px;box-shadow:0 24px 40px -24px var(--shadow)}
.auth-card h2{font-family:var(--font-logo);font-weight:800;font-size:28px;line-height:1.2;margin:0}
.auth-card p{margin:0 0 8px;color:var(--muted);font-size:14px;text-wrap:balance}
.auth-card label{font-size:13px;color:var(--muted);margin-top:4px}
.auth-card input{font:inherit;font-size:16px;padding:11px 12px;border:1px solid var(--line);border-radius:11px;background:var(--bg);color:var(--ink);width:100%;min-width:0}
.auth-card input:focus{outline:2px solid var(--accent-2);outline-offset:1px}
.auth-msg{min-height:1.4em;font-size:13.5px;color:var(--danger);margin:4px 0 2px}
.auth-msg.ok{color:var(--accent)}
.btn.big{min-height:46px;font-size:16px;border-radius:12px}
.btn:disabled{opacity:.5}
.acct{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:28px;padding-top:12px;border-top:1px solid var(--line);font-size:13px;color:var(--muted);min-width:0}
.acct span{min-width:0;overflow-wrap:anywhere}

/* ---------- editor: dots, dividers, numbers you can restart ---------- */
.numk{border:0;background:transparent;padding:3px 2px 0 0;cursor:pointer;border-radius:6px}
.bul{flex:none;width:18px;text-align:center;color:var(--accent);font-size:18px;line-height:1.55}
.hr-row{padding:6px 0}
.hr{display:block;width:100%;height:16px;border:0;background:transparent;position:relative;padding:0;cursor:pointer}
.hr::before{content:"";position:absolute;left:0;right:0;top:50%;border-top:1.5px solid var(--line)}
.hr.armed::before{border-top-color:var(--danger)}
.tools{overflow-x:auto;scrollbar-width:none}
.tools::-webkit-scrollbar{display:none}
.tools .btn{flex:none}
#cornerBtn{font-size:12.5px;padding:0 8px}

/* ---------- drawer list: steady 생각 조각 height, cards pushed to the corner ---------- */
.nest .nbox{height:58px;align-content:center;overflow:hidden}
.nest .n-title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nest .n-pre{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.cornered{opacity:.55;filter:grayscale(.7)}
.seg button{align-content:start}

/* ---------- scrapbook ---------- */
.bm-row{display:flex;gap:6px;align-items:flex-end;overflow-x:auto;padding:0 10px;scrollbar-width:none;position:relative;z-index:1;margin-bottom:-1px}
.bm-row::-webkit-scrollbar{display:none}
.bm{flex:none;min-height:38px;padding:8px 14px 12px;border:0;border-radius:9px 9px 0 0;background:var(--bm);color:#3A332D;font-family:var(--font-title);font-weight:700;font-size:14px;
  transform:translateY(8px);transition:transform .15s;box-shadow:inset 0 -6px 8px -6px rgba(0,0,0,.14)}
.bm.on{transform:none;padding-bottom:16px;box-shadow:none}
.bm.add{background:transparent;border:1.5px dashed var(--line);border-bottom:0;color:var(--muted);min-width:42px}
.book{position:relative;border:1px solid #E7DCCB;border-radius:4px 14px 14px 4px;padding:16px 12px 14px 24px;
  background-color:#FBF7EF;background-image:linear-gradient(transparent 31px,#F1E8DA 31px);background-size:100% 32px;
  box-shadow:inset 10px 0 0 -2px #C48B74,inset 14px 0 10px -8px rgba(0,0,0,.2),0 18px 30px -24px var(--shadow)}
.scraps{display:grid;grid-auto-flow:column;grid-template-rows:repeat(2,auto);grid-auto-columns:calc((100% - 12px)/2);gap:16px 12px;
  overflow-x:auto;scroll-snap-type:x proximity;padding:10px 2px 10px;scrollbar-width:thin}
@media (min-width:560px){.scraps{grid-auto-columns:calc((100% - 24px)/3)}}
.scrap{position:relative;display:flex;flex-direction:column;gap:6px;height:112px;min-width:0;padding:15px 12px 9px;border:0;text-align:left;background:var(--sc);color:#3A332D;
  border-radius:2px;transform:rotate(var(--r,0deg));box-shadow:0 6px 10px -7px rgba(70,50,30,.45);scroll-snap-align:start}
.sc-tape{position:absolute;top:-6px;left:50%;width:34px;height:12px;margin-left:-17px;background:var(--tc);opacity:.9;transform:rotate(-3deg)}
.sc-text{flex:1;min-height:0;font-size:14px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.sc-date{font-size:11px;color:#8A7D70}
.scrap.add{background:rgba(255,255,255,.4);border:1.5px dashed #D9CDBB;box-shadow:none;transform:none;color:#8A7D70;align-items:center;justify-content:center;font-size:14px}
.topic-edit{display:grid;gap:8px;margin:0 0 12px;padding:10px;background:#FFFDF8;border:1px solid #E7DCCB;border-radius:12px}
.topic-in{font:inherit;font-size:16px;padding:9px 11px;border:1px solid #E4DACD;border-radius:9px;background:#FBF7EF;color:#3A332D;width:100%;min-width:0}
.topic-edit .row{display:flex;gap:6px;align-items:center}
.qsheet{z-index:33}
#qBack{z-index:32}
.q-topics{display:flex;gap:6px;overflow-x:auto;padding:12px 0 10px;scrollbar-width:none}
.q-chip{flex:none;border:1.5px solid transparent;background:var(--bm);color:#3A332D;border-radius:999px;padding:6px 12px;font-size:13.5px;opacity:.55}
.q-chip.on{opacity:1;border-color:#3A332D}
#qText{display:block;width:100%;min-height:150px;border:1px solid var(--line);border-radius:12px;color:#3A332D;font:inherit;font-size:16px;line-height:1.6;padding:12px;resize:vertical;outline:none;
  background-color:#FBF7EF;background-image:linear-gradient(transparent 24.6px,#EFE6D7 24.6px);background-size:100% 25.6px;background-position:0 12px}
#qText:focus{border-color:var(--accent-2)}
.q-acts{display:flex;gap:6px;align-items:center;margin-top:10px}

/* ---------- cork board memo paper ---------- */
.notec{position:relative;min-width:0;transform:rotate(var(--r,0deg))}
.note-hit{display:flex;flex-direction:column;gap:3px;width:100%;aspect-ratio:1/1.12;padding:13px 8px 8px;border:0;border-radius:2px 2px 10px 2px;background:var(--nc);color:#3A332D;
  text-align:left;overflow:hidden;box-shadow:0 10px 16px -10px rgba(0,0,0,.45)}
.note-t{font-family:var(--font-hand);font-weight:700;font-size:16px;line-height:1.15;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note-x{font-family:var(--font-hand);font-weight:700;font-size:14px;line-height:1.25;white-space:pre-wrap;overflow-wrap:anywhere;overflow:hidden;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical}
.note-x.none{color:#9B8F82}
.pin{position:absolute;top:-4px;left:50%;width:11px;height:11px;margin-left:-5.5px;border-radius:50%;background:#C9826A;box-shadow:inset -2px -2px 0 rgba(0,0,0,.18),0 2px 3px rgba(0,0,0,.25);z-index:1}
.gal-paper{position:relative;width:min(100%,360px);aspect-ratio:1/1;background:var(--nc,var(--photo));color:#3A332D;padding:28px 20px 18px;border-radius:2px 2px 16px 2px;
  box-shadow:0 18px 30px -20px var(--shadow);border:0;display:block;text-align:left}
.gal-paper .pin{top:9px;width:14px;height:14px;margin-left:-7px}
.gal-paper-x{display:block;width:100%;height:100%;border:0;background:transparent;resize:none;outline:none;color:#3A332D;font-family:var(--font-hand);font-weight:700;font-size:22px;line-height:1.45}
.gal-paper-x::placeholder{color:#9B8F82}
.gal-paper-ro{display:block;font-family:var(--font-hand);font-weight:700;font-size:20px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}

/* ---------- press and hold to carry a memo to furniture ---------- */
[data-drag-id]{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
#panel{transition:opacity .2s}
body.carrying #panel{opacity:0;pointer-events:none}
body.carrying .fab{opacity:0;pointer-events:none}
.furn.hot{filter:drop-shadow(0 0 9px rgba(168,106,80,.85))}
.drag-ghost{position:fixed;left:0;top:0;z-index:70;pointer-events:none;max-width:120px;padding:9px 12px;background:#FFFDF8;color:#3A332D;border:1px solid #E4DACD;border-radius:10px;
  box-shadow:0 14px 28px -10px rgba(60,40,20,.5);font-family:var(--font-title);font-weight:700;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.drag-hint{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:65;background:rgba(58,51,45,.9);color:#FFF8EF;font-size:13.5px;
  border-radius:999px;padding:9px 16px;pointer-events:none;white-space:nowrap}
</style>

<body>
<div class="stage" id="app">
  <svg id="room" viewBox="0 0 360 740" preserveAspectRatio="xMidYMid meet" role="group" aria-label="생각의 방. 가구를 눌러 메모를 열어요. 메모를 꾹 누르면 가구로 옮길 수 있어요"></svg>
</div>
<header class="hud">
  <div>
    <h1>생각의 방</h1>
    <div class="dates" id="dates"></div>
    <p id="note" class="note" hidden>지금은 이 브라우저에만 저장되고 있어요</p>

  <button class="round" data-act="search-open" aria-label="메모 찾기"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 20 20"/></svg></button>
</header>
<button class="fab" data-act="fab-new" aria-label="새 메모 쓰기"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>

    <button class="btn ghost" data-act="close-panel"><svg viewBox="0 0 24 24"><path d="M15 5 8 12l7 7"/></svg>방</button>

    <button class="btn" id="pAdd" data-act="new">+ 새 메모</button>
  </div></div>
  <div class="layer-in">
    <header class="p-head"><h2 id="pTitle"></h2><p id="pSub"></p></header>
    <div id="pBody"></div>
  </div>
</section>

<section id="search" class="layer" hidden role="dialog" aria-label="메모 찾기">
  <div class="bar"><div class="bar-in">
    <button class="btn ghost" data-act="search-close"><svg viewBox="0 0 24 24"><path d="M15 5 8 12l7 7"/></svg>방</button>
    <label class="sr" for="q">메모 찾기</label>
    <input id="q" type="search" placeholder="제목이나 내용으로 찾기" autocomplete="off">
  </div></div>
  <div class="layer-in"><div id="sRes"></div><div class="acct" id="acct" hidden><span id="acctEmail"></span><button class="btn ghost" data-act="logout">로그아웃</button></div></div>
</section>

<section id="editor" class="layer" hidden role="dialog" aria-label="메모">
  <div class="bar">
    <div class="bar-in">
      <button class="btn icon ghost" data-act="ed-back" aria-label="뒤로"><svg viewBox="0 0 24 24"><path d="M15 5 8 12l7 7"/></svg></button>
      <button class="place-chip" id="edChip" data-act="ed-move"></button>
      <span class="sp"></span>
      <button class="btn ghost" id="cornerBtn" data-act="corner" hidden>서랍 구석으로</button>
      <button class="btn ghost danger" id="edRight" data-act="ed-trash">버리기</button>
    </div>
    <div class="bar-in tools" role="toolbar" aria-label="메모 도구">
      <button class="btn tool" data-act="tool-c"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="m8.5 12.5 2.5 2.5 5-6"/></svg>체크</button>
      <button class="btn tool" data-act="tool-n"><svg viewBox="0 0 24 24"><path d="M5 5h2v6M5 11h4M5 14.5c0-1 .8-1.5 1.8-1.5S8.6 13.6 8.6 14.4c0 1.4-3.6 2.6-3.6 4.6h3.8M12 7h8M12 17h8"/></svg>번호</button>
      <button class="btn tool" data-act="tool-b"><svg viewBox="0 0 24 24"><circle cx="6" cy="8" r="1.5"/><circle cx="6" cy="16" r="1.5"/><path d="M11 8h9M11 16h9"/></svg>점</button>
      <button class="btn tool" data-act="tool-hr"><svg viewBox="0 0 24 24"><path d="M3 12h18"/></svg>구분선</button>
      <button class="btn tool" id="toolPh" data-act="tool-ph" hidden><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="m21 16-5-5-8 8"/></svg>사진</button>
    </div>
  </div>
  <div class="layer-in ed">
    <button class="crumb" id="edCrumb" data-act="crumb" hidden></button>
    <textarea id="edTitle" rows="1" placeholder="제목" aria-label="제목"></textarea>
    <div class="phs" id="edPhotos" hidden></div>
    <div id="edBlocks"></div>
    <section id="edKids" hidden aria-label="생각 조각"><div class="kid-list" id="edKidList"></div></section>
  </div>
</section>

<div id="sheetBack" class="scrim" hidden data-act="sheet-close"></div>
<div id="sheet" class="sheet" hidden role="dialog" aria-labelledby="sheetT">
  <div class="sheet-head"><b id="sheetT">어디로 옮길까요?</b><button class="btn" data-act="sheet-close">닫기</button></div>
  <p id="moveNote" class="note-s" hidden>옮기면 원래 아이디어에서 떨어져 나와 따로 놓여요.</p>
  <div id="moveList"></div>
</div>

<div id="lightbox" hidden role="dialog" aria-label="사진 보기">
  <div class="lb-bar">
    <button class="lb-btn" data-act="lb-close">닫기</button>

    <button class="lb-btn" id="lbRemove" data-act="lb-remove">이 사진 빼기</button>

</div>

    <button class="btn ghost" data-act="gal-close"><svg viewBox="0 0 24 24"><path d="M15 5 8 12l7 7"/></svg>보드</button>

    <button class="btn ghost" data-act="gal-open">메모로 열기</button>

  <div class="sheet-head"><b id="qT">스크랩북에 끼워넣기</b><button class="btn primary" data-act="q-save">완료</button></div>
  <div class="q-topics" id="qTopics" role="group" aria-label="주제"></div>

</div>

<input type="file" id="fileIn" accept="image/*" multiple hidden>


<div id="auth" class="auth" hidden>
  <form id="authForm" class="auth-card" autocomplete="on" novalidate>
    <h2>생각의 방</h2>
    <p id="authLead">어느 기기에서든 같은 방을 보려면 로그인해 주세요.</p>
    <label for="authEmail">이메일</label>
    <input id="authEmail" type="email" inputmode="email" autocomplete="email" required>
    <label for="authPw">비밀번호</label>
    <input id="authPw" type="password" autocomplete="current-password" minlength="6" required>
    <p id="authMsg" class="auth-msg" role="status"></p>
    <button class="btn primary big" type="submit" id="authGo">로그인</button>
    <button class="btn ghost" type="button" data-act="auth-toggle" id="authToggle">처음이에요 · 계정 만들기</button>
  </form>
</div>

<script>
(function(){
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const PLACE={stack:'스크랩북',drawer:'서랍',box:'상자',board:'코르크보드',trash:'쓰레기통'};
const SUB={stack:'주제별로 끼워두는 짧은 메모',drawer:'칸마다 나눠 넣는 생각',box:'잡동사니 아이디어',board:'사진이나 메모지를 붙이고 코멘트를 남겨요',trash:'버린 아이디어 · 다시 꺼낼 수 있어요'};
const POS={1:'윗칸',2:'가운데칸',3:'아랫칸'};
const DEF={1:'자주 하는 생각들',2:'가끔 하는 생각들',3:'언젠가 꺼낼 생각들'};
const OLD_DEF={1:'만들 것',2:'일·공부',3:'생활'};
const DEF_TOPICS=[{id:'t1',name:'일상'},{id:'t2',name:'배운 것'},{id:'t3',name:'하고 싶은 것'}];
const TOPIC_COL=['#EAD9A8','#CFDCC9','#EED3CB','#D6DEE8','#E3D4E6','#F0DCC4'];
const VERB={stack:'에 끼워뒀어요',drawer:'에 넣었어요',box:'에 넣었어요',board:'에 붙였어요'};
const LKEY='idea-room-v1',NKEY='idea-room-names';
let names={...DEF},topics=DEF_TOPICS.map(t=>({...t}));
const shelfName=k=>String(names[k]||'').trim()||DEF[k];
/* drawer names and scrapbook topics live together in the settings row */
function applyPrefs(p){
  p=p||{};const n={...DEF};
  for(const k of [1,2,3]){const v=String(p[k]==null?'':p[k]).trim();if(v&&v!==OLD_DEF[k])n[k]=v}
  names=n;
  const t=Array.isArray(p.topics)?p.topics.filter(t=>t&&t.id).map(t=>({id:String(t.id),name:String(t.name||'주제').slice(0,14)})):[];
  topics=t.length?t:DEF_TOPICS.map(t=>({...t}));
}
const prefsObj=()=>({1:names[1],2:names[2],3:names[3],topics});
const topicOf=d=>{const t=topics.find(t=>t.id===d.topic);return t?t.id:topics[0].id};
const topicCol=id=>TOPIC_COL[Math.max(0,topics.findIndex(t=>t.id===id))%TOPIC_COL.length];

/* ================= store: Supabase when config.js is filled, this browser otherwise ================= */
const CFG=window.IDEA_ROOM_CONFIG||{};
const hasCfg=!!(CFG.supabaseUrl&&CFG.supabaseKey);
const sb=(hasCfg&&window.supabase&&window.supabase.createClient)
  ?window.supabase.createClient(String(CFG.supabaseUrl).trim(),String(CFG.supabaseKey).trim(),{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}):null;
const S={docs:new Map(),loaded:false};
let mode='boot',me=null,myEmail='';
const timers=new Map(),chains=new Map(),dirty=new Set(),tomb=new Set(),failed=new Set();
const now=()=>Date.now();
const uid=()=>now().toString(36)+Math.random().toString(36).slice(2,8);
const get=id=>S.docs.get(id);
const all=()=>[...S.docs.values()];
function newDoc(o){const t=now();return {id:uid(),place:'box',shelf:1,parent:null,title:'',blocks:[{t:'p',x:''}],photos:[],created:t,updated:t,...o}}
function put(d,delay=0){d={...d,updated:now()};S.docs.set(d.id,d);tomb.delete(d.id);dirty.add(d.id);schedule(d.id,delay);changed();return d}
function del(id){S.docs.delete(id);tomb.add(id);dirty.add(id);schedule(id,0);changed()}
function schedule(id,delay){clearTimeout(timers.get(id));timers.set(id,setTimeout(()=>{timers.delete(id);send(id)},delay))}
function flushNow(id){if(timers.has(id)){clearTimeout(timers.get(id));timers.delete(id);send(id)}}
function flushAll(){[...timers.keys()].forEach(flushNow);persistCache(true)}
function send(id){
  if(mode==='boot'||mode==='auth')return;
  if(mode==='local'){dirty.delete(id);tomb.delete(id);persistLocal();return}
  persistCache();
  const prev=chains.get(id)||Promise.resolve();
  const p=prev.then(()=>writeCloud(id)).then(()=>true,()=>false).then(ok=>{
    if(ok)failed.delete(id);else{failed.add(id);netToast()}
    if(chains.get(id)===p){chains.delete(id);if(ok&&!timers.has(id)){dirty.delete(id);tomb.delete(id);persistCache()}}
  });
  chains.set(id,p);
}
async function writeCloud(id){
  const d=S.docs.get(id);
  const r=d?await sb.from('ideas').upsert({user_id:me,id,doc:JSON.parse(JSON.stringify(d)),updated_at:new Date().toISOString()},{onConflict:'user_id,id'})
           :await sb.from('ideas').delete().eq('user_id',me).eq('id',id);
  if(r.error)throw r.error;
}
let netT=0;
function netToast(){const t=now();if(t-netT<8000)return;netT=t;toast('지금은 저장이 안 돼요. 인터넷이 다시 연결되면 저장할게요.')}

/* this browser only (no Supabase yet) */
let lt;
function persistLocal(){clearTimeout(lt);lt=setTimeout(()=>{try{localStorage.setItem(LKEY,JSON.stringify(all()))}catch(e){toast('이 브라우저에 더 저장할 공간이 없어요.')}},300)}
function startLocal(){
  mode='local';
  try{const raw=localStorage.getItem(LKEY);if(raw)JSON.parse(raw).forEach(d=>{if(d&&d.id&&!S.docs.has(d.id))S.docs.set(d.id,d)})}catch(e){}
  try{const r=localStorage.getItem(NKEY);if(r)applyPrefs(JSON.parse(r))}catch(e){}
  dirty.clear();tomb.clear();persistLocal();S.loaded=true;
  const n=$('#note');n.textContent='Supabase 연결 전이라 이 브라우저에만 저장돼요';n.hidden=false;
  changed();
}

/* Supabase: a local copy opens the room instantly, unsent changes survive a reload */
const CKEY=()=>'idea-room-cache-'+me;
let ct;
function persistCache(now_){
  if(mode!=='cloud'||!me)return;
  const w=()=>{try{localStorage.setItem(CKEY(),JSON.stringify({docs:all(),pending:[...dirty],tombs:[...tomb],prefs:prefsObj()}))}catch(e){}};
  clearTimeout(ct);if(now_)w();else ct=setTimeout(w,400);
}
function loadCache(){
  try{const raw=localStorage.getItem(CKEY());if(!raw)return;const c=JSON.parse(raw);
    (c.docs||[]).forEach(d=>{if(d&&d.id)S.docs.set(d.id,d)});
    (c.tombs||[]).forEach(id=>{S.docs.delete(id);tomb.add(id);dirty.add(id)});
    (c.pending||[]).forEach(id=>dirty.add(id));
    if(c.prefs)applyPrefs(c.prefs);else if(c.names)applyPrefs(c.names);
  }catch(e){}
}
async function fetchAll(){
  const rows=[];
  for(let from=0;;from+=1000){
    const {data,error}=await sb.from('ideas').select('id,doc').order('id').range(from,from+999);
    if(error)throw error;rows.push(...data);if(data.length<1000)break;
  }
  const next=new Map();
  for(const r of rows){if(tomb.has(r.id))continue;next.set(r.id,{...r.doc,id:r.id})}
  for(const id of dirty){if(tomb.has(id))next.delete(id);else if(S.docs.has(id))next.set(id,S.docs.get(id))}
  S.docs=next;S.loaded=true;
  const st=await sb.from('settings').select('drawer_names').eq('user_id',me).maybeSingle();
  if(!st.error&&st.data&&st.data.drawer_names)applyPrefs(st.data.drawer_names);
  persistCache();changed();
}
async function startCloud(session){
  if(mode==='cloud'&&me===session.user.id)return;
  me=session.user.id;myEmail=session.user.email||'';mode='cloud';hideAuth();$('#note').hidden=true;
  loadCache();S.loaded=S.docs.size>0;changed();
  try{await fetchAll()}catch(e){S.loaded=true;changed();toast('메모를 불러오지 못했어요. 인터넷 연결을 확인해 주세요.')}
  [...dirty].forEach(id=>{if(!timers.has(id)&&!chains.has(id))send(id)});
}
async function refresh(){
  if(mode!=='cloud')return;
  [...failed].forEach(id=>{if(!timers.has(id)&&!chains.has(id))send(id)});
  try{await fetchAll()}catch(e){}
}
function resetToAuth(){
  timers.forEach(t=>clearTimeout(t));timers.clear();
  mode='auth';me=null;myEmail='';S.docs=new Map();S.loaded=false;dirty.clear();tomb.clear();failed.clear();urls.clear();badUrl.clear();
  applyPrefs({});panel=null;cur=null;edStack=[];['#panel','#editor','#search','#gal'].forEach(hide);galIds=[];closeQ();closeSheet();closeLB();
  changed();showAuth();
}
async function savePrefs(){
  changed();const p=prefsObj();
  if(mode==='cloud'){
    persistCache();
    const {error}=await sb.from('settings').upsert({user_id:me,drawer_names:p,updated_at:new Date().toISOString()},{onConflict:'user_id'});
    if(error)toast('설정을 저장하지 못했어요.');
  }else{try{localStorage.setItem(NKEY,JSON.stringify(p))}catch(e){}}
}
function saveNames(n){for(const k of [1,2,3])names[k]=String(n[k]||'').trim()||DEF[k];return savePrefs()}

/* photos: private bucket, shown through short-lived signed links */
const BLANK='data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';
const urls=new Map(),badUrl=new Set(),wantUrl=new Set();let wantT=0;
function srcOf(p){
  p=String(p);if(p.startsWith('data:'))return p;
  const u=urls.get(p);if(u&&u.exp>now())return u.url;
  if(mode==='cloud'&&!badUrl.has(p)){wantUrl.add(p);if(!wantT)wantT=setTimeout(fetchUrls,0)}
  return u?u.url:BLANK;
}
async function fetchUrls(){
  wantT=0;const ps=[...wantUrl];wantUrl.clear();if(!ps.length||mode!=='cloud')return;
  ps.forEach(p=>badUrl.add(p));
  try{
    const {data,error}=await sb.storage.from('photos').createSignedUrls(ps,60*60*12);
    if(error||!data){ps.forEach(p=>badUrl.delete(p));return}
    let any=false;
    data.forEach(r=>{if(r&&r.signedUrl&&!r.error){urls.set(r.path,{url:r.signedUrl,exp:now()+11*3600e3});badUrl.delete(r.path);any=true}});
    if(any)changed();
  }catch(e){ps.forEach(p=>badUrl.delete(p))}
}

/* sign in */
let signup=false;
function showAuth(){$('#auth').hidden=false;setSignup(signup)}
function hideAuth(){$('#auth').hidden=true}
function setSignup(v){
  signup=v;
  $('#authGo').textContent=v?'계정 만들기':'로그인';
  $('#authToggle').textContent=v?'이미 계정이 있어요 · 로그인':'처음이에요 · 계정 만들기';
  $('#authPw').setAttribute('autocomplete',v?'new-password':'current-password');
  $('#authLead').textContent=v?'이메일과 비밀번호(6자 이상)를 정해 주세요. 확인 메일이 가요.':'어느 기기에서든 같은 방을 보려면 로그인해 주세요.';
}
function authMsg(t,ok){const m=$('#authMsg');m.textContent=t||'';m.classList.toggle('ok',!!ok)}
function authErr(e){
  const m=String((e&&e.message)||'');
  if(/invalid login/i.test(m))return '이메일이나 비밀번호가 맞지 않아요.';
  if(/not confirmed/i.test(m))return '메일 확인이 아직 안 됐어요. 받은 메일의 링크를 먼저 눌러 주세요.';
  if(/already (registered|exists)/i.test(m))return '이미 가입된 이메일이에요. 로그인해 주세요.';
  if(/at least|password should/i.test(m))return '비밀번호는 6자 이상으로 해 주세요.';
  if(/signups? not allowed/i.test(m))return '새 계정 만들기가 꺼져 있어요.';
  if(/rate limit|too many/i.test(m))return '잠깐 너무 많이 시도했어요. 조금 뒤에 다시 해 주세요.';
  if(/fetch|network|failed to/i.test(m))return '인터넷 연결을 확인해 주세요.';
  return '잘 안 됐어요. ('+m+')';
}
async function boot(){
  changed();
  if(!sb){
    if(hasCfg){mode='auth';showAuth();authMsg('Supabase를 불러오지 못했어요. 인터넷 연결을 확인하고 다시 열어 주세요.');return}
    startLocal();return;
  }
  mode='auth';
  sb.auth.onAuthStateChange((ev,s)=>{
    if(s&&s.user&&(ev==='SIGNED_IN'||ev==='INITIAL_SESSION'))setTimeout(()=>startCloud(s),0);
    else if(ev==='SIGNED_OUT')setTimeout(resetToAuth,0);
  });
  let session=null;try{const {data}=await sb.auth.getSession();session=data&&data.session}catch(e){}
  if(session)startCloud(session);else if(mode!=='cloud')showAuth();
}

/* ================= queries ================= */
function inPlace(place,shelf){return all().filter(d=>d.place===place&&(place!=='drawer'||(d.shelf||1)===shelf))}
function tops(place,shelf){const L=inPlace(place,shelf);const ids=new Set(L.map(d=>d.id));return L.filter(d=>!d.parent||!ids.has(d.parent))}
function kids(id){const p=get(id);if(!p)return [];return all().filter(d=>d.parent===id&&d.place===p.place).sort((a,b)=>a.created-b.created)}
function isKid(d){const p=d&&d.parent&&get(d.parent);return !!(p&&p.place===d.place)}
const byNew=(a,b)=>(b.created||0)-(a.created||0);
function titleOf(d){if(d.title&&d.title.trim())return d.title.trim();const f=(d.blocks||[]).find(b=>b.x&&b.x.trim());return f?f.x.trim():''}
function preview(d){const bs=(d.blocks||[]).filter(b=>b.x&&b.x.trim());const rest=(d.title&&d.title.trim())?bs:bs.slice(1);return rest.map(b=>b.x.trim()).join(' · ')}
function textOf(d){return [d.title,...(d.blocks||[]).map(b=>b.x)].join(' ')}
function isEmpty(d){return !(d.title||'').trim()&&!(d.blocks||[]).some(b=>(b.x||'').trim())&&!(d.photos||[]).length}
function fmtDate(t){const d=new Date(t),n=new Date();if(d.toDateString()===n.toDateString())return d.getHours()+':'+String(d.getMinutes()).padStart(2,'0');return (d.getMonth()+1)+'.'+d.getDate()+(d.getFullYear()!==n.getFullYear()?' '+d.getFullYear():'')}
function meta(d){const p=[fmtDate(d.updated||d.created)];const cs=(d.blocks||[]).filter(b=>b.t==='c');if(cs.length)p.push('체크 '+cs.filter(b=>b.d).length+'/'+cs.length);if((d.photos||[]).length)p.push('사진 '+d.photos.length);const k=kids(d.id).length;if(k)p.push('생각 조각 '+k);return p.join(' · ')}
function placeLabel(d){return d.place==='drawer'?'서랍 · '+shelfName(d.shelf||1):d.place==='stack'?'스크랩북 · '+((topics.find(t=>t.id===topicOf(d))||{}).name||''):PLACE[d.place]||'상자'}
function hashStr(s){let h=0;for(const ch of String(s))h=(h*31+ch.charCodeAt(0))|0;return Math.abs(h)}
const canPhoto=()=>mode==='local'||mode==='cloud';

/* ================= actions ================= */
function moveTo(id,p,s,tp){
  const d=get(id);if(!d)return;
  const ks=kids(id);const shelf=p==='drawer'?(s||1):(d.shelf||1);
  const extra=p==='stack'?{topic:tp||topicOf(d)}:{};
  put({...d,place:p,shelf,parent:null,corner:false,...extra});
  ks.forEach(k=>put({...k,place:p,shelf,...extra}));
}
function trashDoc(id){
  const d=get(id);if(!d)return;const t=now();const ks=kids(id);
  put({...d,from:d.place,fromShelf:d.shelf||1,place:'trash',trashedAt:t,withParent:false});
  ks.forEach(k=>put({...k,from:k.place,fromShelf:k.shelf||1,place:'trash',trashedAt:t,withParent:true}));
}
function restore(id){
  const d=get(id);if(!d||d.place!=='trash')return;
  let place=(d.from&&d.from!=='trash')?d.from:'box',shelf=d.fromShelf||1,parent=d.parent||null;
  if(parent){const p=get(parent);if(p&&p.place!=='trash'){place=p.place;shelf=p.shelf||1}else parent=null}
  const ks=all().filter(k=>k.parent===id&&k.place==='trash'&&k.withParent);
  const clear={from:null,fromShelf:null,trashedAt:null,withParent:false};
  put({...d,place,shelf,parent,...clear});
  ks.forEach(k=>put({...k,place,shelf,...clear}));
}
function dropAsset(p){p=String(p||'');if(mode==='cloud'&&p&&!p.startsWith('data:'))sb.storage.from('photos').remove([p]).then(()=>{},()=>{})}
function purge(id){
  const d=get(id);if(!d)return;
  const ks=all().filter(k=>k.parent===id&&k.place==='trash');
  [d,...ks].forEach(x=>{(x.photos||[]).forEach(dropAsset);del(x.id)});
}

/* ================= the room ================= */
const f=n=>Math.round(n*10)/10;
function textW(t,size){let w=0;for(const ch of String(t))w+=/[0-9.+]/.test(ch)?size*.6:/[A-Za-z]/.test(ch)?size*.6:ch===' '?size*.3:ch==='·'||ch==='…'?size*.5:size;return w}
function fitLabel(t,max){t=String(t);if(textW(t,9.5)+12<=max)return t;let s=t;while(s.length>1&&textW(s+'…',9.5)+12>max)s=s.slice(0,-1);return s+'…'}
function pill(cx,cy,name,n){
  const b=n>0?(n>99?'99+':String(n)):'',w=textW(name,11.5)+(b?textW(b,11.5)+5:0)+24,x=cx-w/2;
  return '<g class="pill"><rect x="'+f(x)+'" y="'+(cy-10.5)+'" width="'+f(w)+'" height="21" rx="10.5"/><text x="'+f(cx)+'" y="'+(cy+.5)+'" text-anchor="middle" dominant-baseline="central">'+esc(name)+(b?'<tspan class="pn" dx="5">'+b+'</tspan>':'')+'</text></g>';
}
function leaf(bx,by,tx,ty,w,col,vein){
  const dx=tx-bx,dy=ty-by,L=Math.hypot(dx,dy)||1,nx=-dy/L*w,ny=dx/L*w,mx=bx+dx*.5,my=by+dy*.5;
  return '<path d="M'+f(bx)+' '+f(by)+'Q'+f(mx+nx)+' '+f(my+ny)+' '+f(tx)+' '+f(ty)+'Q'+f(mx-nx)+' '+f(my-ny)+' '+f(bx)+' '+f(by)+'Z" fill="'+col+'"/>'+
    (vein?'<path d="M'+f(bx)+' '+f(by)+'Q'+f(mx+nx*.12)+' '+f(my+ny*.12)+' '+f(tx)+' '+f(ty)+'" stroke="'+vein+'" stroke-width=".8" fill="none" opacity=".7"/>':'');
}
const furn=(go,label,id)=>'<g class="furn"'+(id?' id="'+id+'"':'')+' data-go="'+go+'" role="button" tabindex="0" aria-label="'+esc(label)+'">';

/* time of day: 17–19 sunset, 19–6 night, otherwise day */
function period(){const h=new Date().getHours();return h>=17&&h<19?'dusk':(h>=19||h<6)?'night':'day'}
const LOOK={
  day:  {sky:['#C8D8E2','#EAEFEE'],tree:['#BACAB4','#A9BBA3'],bld:['#DAE2E7','#D1DAE0'],wall:'#F6EFE6',wa:.85,floor:'#FFFBF5',fa:.75,glare:.6},
  dusk: {sky:['#D9A6A0','#F4D3B4'],tree:['#AFA697','#9C9584'],bld:['#D8BDB6','#CDB0AA'],wall:'#F8DCC6',wa:.8,floor:'#FBE3CF',fa:.65,glare:.4},
  night:{sky:['#2C3354','#4B4F74'],tree:['#46514F','#3B4544'],bld:['#4A5070','#414764'],wall:null,wa:0,floor:null,fa:0,glare:.18}
};
/* a crumpled paper ball: an uneven outline, a shaded side and a few creases */
function crumple(cx,cy,r,seed){
  let pts=[];for(let i=0;i<10;i++){const a=i/10*Math.PI*2,k=.8+.24*Math.abs(Math.sin(seed*7.3+i*2.1));pts.push([cx+Math.cos(a)*r*k,cy+Math.sin(a)*r*k*.92])}
  const d='M'+pts.map(p=>f(p[0])+' '+f(p[1])).join('L')+'Z';
  let s='<path d="'+d+'" fill="#FBF8F2" stroke="#D9CEBE" stroke-width=".8" stroke-linejoin="round"/>';
  s+='<path d="M'+f(cx+r*.15)+' '+f(cy-r*.05)+'L'+f(pts[1][0])+' '+f(pts[1][1])+'L'+f(pts[3][0])+' '+f(pts[3][1])+'Z" fill="#EEE6D8"/>';

let panel=null,armed=null,armT,panelPending=false;
function show(sel){$(sel).hidden=false}
function hide(sel){$(sel).hidden=true}
function arm(key){armed=key;clearTimeout(armT);armT=setTimeout(()=>{armed=null;renderPanel()},3500)}
const typing=box=>{const ae=document.activeElement;return !!(ae&&box.contains(ae)&&/^(INPUT|TEXTAREA)$/.test(ae.tagName))};

function openPanel(place,shelf){panel={place,shelf:shelf||1,editNames:false,draft:null,topic:null,topicEdit:null,topicDraft:null};armed=null;show('#panel');$('#panel').scrollTop=0;renderPanel(true)}
function renderPanel(force){
  if(!panel||$('#panel').hidden)return;
  const body=$('#pBody');
  if(!force&&typing(body)){panelPending=true;return}
  panelPending=false;
  const {place}=panel,add=$('#pAdd');
  $('#pTitle').textContent=PLACE[place];$('#pSub').textContent=SUB[place];
  add.hidden=false;add.className='btn';
  if(place==='trash'){const has=all().some(d=>d.place==='trash');add.hidden=!has;add.textContent=armed==='empty'?'정말 다 지울까요?':'비우기';add.dataset.act='empty';add.className='btn danger'+(armed==='empty'?' armed':'')}
  else if(place==='stack'){add.textContent='+ 끼워넣기';add.dataset.act='scrap-new'}
  else if(place==='board'){add.textContent='+ 메모지';add.dataset.act='board-note'}
  else{add.textContent='+ 새 메모';add.dataset.act='new'}
  if(!S.loaded){body.innerHTML='<p class="empty">불러오는 중…</p>';return}
  const sc=$('#scrapScroll'),sl=sc?sc.scrollLeft:0;
  body.innerHTML=place==='drawer'?drawerHTML():place==='box'?boxHTML():place==='board'?boardHTML():place==='trash'?trashHTML():scrapHTML();
  const sc2=$('#scrapScroll');if(sc2&&sl)sc2.scrollLeft=sl;
}
function nestHTML(ks,pid,self){
  if(!ks.length)return '';
  return '<div class="nest">'+ks.map(k=>{const t=titleOf(k),pr=preview(k);
    return '<button class="nbox" data-open="'+(self?k.id:pid)+'"'+(self?'':' data-fk="'+k.id+'"')+'><span class="n-title'+(t?'':' none')+'">'+esc(t||'제목 없음')+'</span>'+(pr?'<span class="n-pre">'+esc(pr)+'</span>':'')+'</button>'}).join('')+'</div>';
}
function card(d,cls){
  const t=titleOf(d),pre=preview(d);
  return '<article class="card '+cls+(d.corner?' cornered':'')+'"><button class="card-main" data-open="'+d.id+'" data-drag-id="'+d.id+'"><span class="c-title'+(t?'':' none')+'">'+esc(t||'제목 없음')+'</span>'+(pre?'<span class="c-pre">'+esc(pre)+'</span>':'')+'<span class="c-meta">'+esc((d.corner?'구석 · ':'')+meta(d))+'</span></button>'+nestHTML(kids(d.id),d.id,false)+'</article>';
}
function drawerHTML(){
  const s=panel.shelf;let h='';
  if(panel.editNames){
    const dr=panel.draft||(panel.draft={1:shelfName(1),2:shelfName(2),3:shelfName(3)});
    h+='<div class="names"><b>칸 이름 바꾸기</b>';
    for(let k=1;k<=3;k++)h+='<label for="name-'+k+'">'+POS[k]+'<input id="name-'+k+'" class="name-in" data-k="'+k+'" maxlength="14" value="'+esc(dr[k])+'" placeholder="'+esc(DEF[k])+'"></label>';
    h+='<div class="row"><button class="btn ghost" data-act="rename-cancel">취소</button><button class="btn primary" data-act="rename-done">저장</button></div></div>';
  }else{
    h+='<div class="seg" role="tablist" aria-label="서랍 칸">';
    for(let k=1;k<=3;k++)h+='<button role="tab" id="shelf-'+k+'" aria-selected="'+(k===s)+'" data-act="shelf" data-s="'+k+'"><span class="s-name">'+esc(shelfName(k))+'</span><span class="s-sub">'+POS[k]+' · '+tops('drawer',k).length+'개</span></button>';
    h+='</div><div class="rename"><button class="btn ghost" data-act="rename">칸 이름 바꾸기</button></div>';
  }
  const items=tops('drawer',s).sort((a,b)=>((a.corner?1:0)-(b.corner?1:0))||byNew(a,b));
  return h+(items.length?'<div class="cards">'+items.map(d=>card(d,'')).join('')+'</div>':'<p class="empty">‘'+esc(shelfName(s))+'’ 칸은 비어 있어요. 위의 ‘+ 새 메모’로 채워 보세요.</p>');
}

/* scrapbook: topics as bookmarks, short notes tucked in a sideways-scrolling page */
const SCRAP_COL=['#FFFDF8','#FBF3E2','#F6EDEF','#EEF3EC'];
function scrapHTML(){
  const ct=topics.some(t=>t.id===panel.topic)?panel.topic:topics[0].id;panel.topic=ct;
  let h='<div class="bm-row" role="tablist" aria-label="스크랩북 주제">';
  topics.forEach(t=>{h+='<button class="bm'+(t.id===ct?' on':'')+'" role="tab" aria-selected="'+(t.id===ct)+'" data-act="topic" data-t="'+t.id+'" style="--bm:'+topicCol(t.id)+'">'+esc(t.name)+'</button>'});
  h+='<button class="bm add" data-act="topic-add" aria-label="주제 추가">+</button></div>';
  h+='<div class="book">';
  if(panel.topicEdit){
    const isNew=panel.topicEdit==='new',v=panel.topicDraft!=null?panel.topicDraft:(isNew?'':((topics.find(t=>t.id===panel.topicEdit)||{}).name||''));
    h+='<div class="topic-edit"><label class="sr" for="topicName">주제 이름</label><input id="topicName" class="topic-in" maxlength="14" value="'+esc(v)+'" placeholder="'+(isNew?'새 주제 이름':'주제 이름')+'" autocomplete="off">'+
      '<div class="row">'+(isNew?'':'<button class="btn ghost danger'+(armed==='tdel'?' armed':'')+'" data-act="topic-del">'+(armed==='tdel'?'정말 지울까요?':'주제 지우기')+'</button>')+
      '<span class="sp"></span><button class="btn ghost" data-act="topic-cancel">취소</button><button class="btn primary" data-act="topic-save">'+(isNew?'추가':'저장')+'</button></div></div>';
  }
  const items=tops('stack').filter(d=>topicOf(d)===ct).sort(byNew);
  h+='<div class="scraps" id="scrapScroll">';
  h+=items.map(d=>{const hs=hashStr(d.id),r=((hs%5)-2)*.7,txt=[titleOf(d),preview(d)].filter(Boolean).join('\n');
    return '<button class="scrap" style="--r:'+r+'deg;--sc:'+SCRAP_COL[hs%SCRAP_COL.length]+';--tc:'+topicCol(ct)+'" data-act="scrap-edit" data-id="'+d.id+'" data-drag-id="'+d.id+'"><span class="sc-tape" aria-hidden="true"></span><span class="sc-text">'+esc(txt||'빈 종이')+'</span><span class="sc-date">'+esc(fmtDate(d.updated||d.created))+'</span></button>'}).join('');
  h+='<button class="scrap add" data-act="scrap-new">+ 끼워넣기</button></div></div>';
  h+='<p class="hint">'+(items.length>3?'옆으로 넘겨 보세요 · ':'')+'고른 책갈피를 한 번 더 누르면 주제 이름을 바꿀 수 있어요</p>';
  return h;
}
function boxHTML(){
  const items=tops('box').sort(byNew);
  if(!items.length)return '<p class="empty">떠오른 건 일단 여기 던져 두세요. 방에서 + 버튼을 누르면 바로 여기로 들어와요.</p>';
  return '<div class="notes">'+items.map(d=>{const t=titleOf(d),pre=preview(d),hs=hashStr(d.id),r=((hs%7)-3)*.6;
    return '<button class="sticky" style="--r:'+r+'deg;--nc:var(--n'+(hs%4+1)+')" data-open="'+d.id+'" data-drag-id="'+d.id+'"><span class="c-title'+(t?'':' none')+'">'+esc(t||'제목 없음')+'</span>'+(pre?'<span class="c-pre">'+esc(pre)+'</span>':'')+'<span class="c-meta">'+esc(meta(d))+'</span></button>'}).join('')+'</div>';
}

/* cork board: photos and memo paper pinned in a grid */
const boardBusy=new Set();
const TAPE=['#CFDCC9','#EED3CB','#EFE2BF','#D8DEE6'];
const NOTE_COL=['#F6E7B8','#DDE8D6','#F3D9D3','#DCE4EC'];
const noteCol=d=>NOTE_COL[(d.nc!=null?d.nc:hashStr(d.id))%4];
const noteText=d=>(d.blocks||[]).map(b=>b.x||'').join('\n').replace(/\s+$/,'');
function boardHTML(){
  const items=tops('board').sort(byNew);
  let h='<div class="board" id="boardScroll">';
  h+=items.map(d=>{const p=(d.photos||[])[0],hs=hashStr(d.id),r=((hs%5)-2)*.9,tr=((hs%3)-1)*5;
    if(!p&&!boardBusy.has(d.id)){
      const txt=noteText(d);
      return '<div class="notec" style="--r:'+r+'deg;--nc:'+noteCol(d)+'"><span class="pin" aria-hidden="true"></span>'+
        '<button class="note-hit" data-act="gal" data-id="'+d.id+'" data-drag-id="'+d.id+'" aria-label="메모지 크게 보기">'+(d.title?'<span class="note-t">'+esc(d.title)+'</span>':'')+'<span class="note-x'+(txt||d.title?'':' none')+'">'+esc(txt||(d.title?'':'빈 메모지'))+'</span></button></div>';
    }
    const pic=p?'<span class="pol-img"><img src="'+esc(srcOf(p))+'" data-p="'+esc(p)+'" alt="" loading="lazy">'+(d.photos.length>1?'<span class="more">+'+(d.photos.length-1)+'</span>':'')+'</span>'
      :'<span class="pol-img busy">올리는 중…</span>';
    return '<div class="polc" style="--r:'+r+'deg;--tr:'+tr+'deg;--tc:'+TAPE[hs%4]+'"><span class="tape" aria-hidden="true"></span>'+
      '<button class="pol-hit" data-act="gal" data-id="'+d.id+'" data-drag-id="'+d.id+'" aria-label="크게 보기">'+pic+'</button>'+
      '<label class="sr" for="line-'+d.id+'">사진 제목</label><input class="pol-line" id="line-'+d.id+'" data-line="'+d.id+'" maxlength="40" value="'+esc(d.title||'')+'" placeholder="제목" autocomplete="off"></div>'}).join('');
  if(canPhoto())h+='<button class="polc add" data-act="board-photo"><span class="add-plus" aria-hidden="true">+</span>사진</button>';
  h+='<button class="polc add note-add" data-act="board-note"><span class="add-plus" aria-hidden="true">+</span>메모지</button>';
  h+='</div><p class="hint">'+(items.length?'누르면 크게 넘겨 보면서 코멘트를 달 수 있어요':'사진이나 메모지를 붙여 보세요')+'</p>';
  return h;
}
let galIds=[],galIdx=0;
const isPlain=d=>(d.blocks||[]).every(b=>b.t==='p');
function galSlide(d){
  const p=(d.photos||[])[0];
  const roText=()=>esc((d.blocks||[]).filter(b=>b.x).map(b=>(b.t==='c'?(b.d?'☑ ':'☐ '):b.t==='n'?'· ':b.t==='b'?'• ':'')+b.x).join('\n'));
  if(!p){
    const paper=isPlain(d)
      ?'<div class="gal-paper" style="--nc:'+noteCol(d)+'"><span class="pin" aria-hidden="true"></span><label class="sr" for="gp-'+d.id+'">메모지 내용</label><textarea class="gal-paper-x" id="gp-'+d.id+'" data-id="'+d.id+'" placeholder="메모지에 적기">'+esc(noteText(d))+'</textarea></div>'
      :'<button class="gal-paper" style="--nc:'+noteCol(d)+'" data-act="gal-open"><span class="gal-paper-ro">'+roText()+'</span></button>';
    return '<section class="gal-item" data-id="'+d.id+'"><div class="gal-pic">'+paper+'</div><div class="gal-text">'+
      '<input class="gal-title" data-id="'+d.id+'" maxlength="40" value="'+esc(d.title||'')+'" placeholder="제목 (없어도 돼요)" aria-label="제목" autocomplete="off"></div></section>';
  }
  const note=isPlain(d)
    ?'<textarea class="gal-note" data-id="'+d.id+'" rows="2" placeholder="코멘트 남기기" aria-label="코멘트">'+esc(noteText(d))+'</textarea>'
    :'<button class="gal-ro" data-act="gal-open">'+roText()+'</button>';
  return '<section class="gal-item" data-id="'+d.id+'"><div class="gal-pic"><img data-p="'+esc(p)+'" src="'+esc(srcOf(p))+'" alt=""></div><div class="gal-text">'+
    '<input class="gal-title" data-id="'+d.id+'" maxlength="40" value="'+esc(d.title||'')+'" placeholder="제목" aria-label="제목" autocomplete="off">'+note+'</div></section>';
}
function openGal(id){
  const items=tops('board').sort(byNew);galIds=items.map(d=>d.id);galIdx=Math.max(0,galIds.indexOf(id));
  const st=$('#galStrip');st.innerHTML=items.map(galSlide).join('');
  $('#gal').hidden=false;st.querySelectorAll('.gal-note').forEach(size);
  requestAnimationFrame(()=>{st.scrollLeft=st.clientWidth*galIdx;galCount()});
}
function galCount(){$('#galCount').textContent=galIds.length?(galIdx+1)+' / '+galIds.length:''}
function closeGal(){
  if($('#gal').hidden)return;
  galIds.forEach(id=>{const d=get(id);if(d&&d.place==='board'&&isEmpty(d)&&!boardBusy.has(id))del(id);else flushNow(id)});
  $('#gal').hidden=true;$('#galStrip').innerHTML='';galIds=[];renderPanel();
}
function galImgs(){if($('#gal').hidden)return;$('#galStrip').querySelectorAll('img[data-p]').forEach(img=>{const u=srcOf(img.dataset.p);if(img.getAttribute('src')!==u)img.src=u})}
function fromLabel(d){return d.from==='drawer'?'서랍 · '+shelfName(d.fromShelf||1)+'에서':(PLACE[d.from]||'상자')+'에서'}
function trashHTML(){
  const T=all().filter(d=>d.place==='trash'),ids=new Set(T.map(d=>d.id));
  const items=T.filter(d=>!d.parent||!ids.has(d.parent)).sort((a,b)=>(b.trashedAt||0)-(a.trashedAt||0));
  if(!items.length)return '<p class="empty">버린 아이디어가 없어요.</p>';
  return '<div class="cards">'+items.map(d=>{const t=titleOf(d),pr=preview(d);
    return '<article class="crump"><button class="card-main" data-open="'+d.id+'" data-drag-id="'+d.id+'"><span class="c-title">'+esc(t||'제목 없음')+'</span>'+(pr?'<span class="c-pre">'+esc(pr)+'</span>':'')+'<span class="c-meta">'+esc(fromLabel(d)+' · '+fmtDate(d.trashedAt||d.updated))+'</span></button>'+
      nestHTML(T.filter(k=>k.parent===d.id),d.id,true)+
      '<div class="row-acts"><button class="btn" data-act="restore" data-id="'+d.id+'">다시 꺼내기</button><button class="btn danger'+(armed==='p:'+d.id?' armed':'')+'" data-act="purge" data-id="'+d.id+'">'+(armed==='p:'+d.id?'정말 지울까요?':'영구 삭제')+'</button></div></article>'}).join('')+'</div>';
}

/* quick scrap sheet: a plain note for the scrapbook */
let q=null;
const isPlainDoc=d=>!(d.title||'').trim()&&isPlain(d)&&!(d.photos||[]).length&&!kids(d.id).length;
function openQ(id){
  const d=id&&get(id);
  if(d&&!isPlainDoc(d)){edStack=[];cur=null;openEditor(id);return}
  q={id:d?d.id:null,topic:d?topicOf(d):((panel&&panel.topic)||topics[0].id)};
  $('#qT').textContent=d?'스크랩 고치기':'스크랩북에 끼워넣기';
  $('#qText').value=d?noteText(d):'';
  $('#qTrash').hidden=!d;$('#qMore').hidden=!d;
  renderQTopics();
  $('#qBack').hidden=false;$('#qsheet').hidden=false;
  setTimeout(()=>{const t=$('#qText');t.focus();t.setSelectionRange(t.value.length,t.value.length)},60);
}
function renderQTopics(){if(!q)return;$('#qTopics').innerHTML=topics.map(t=>'<button class="q-chip'+(t.id===q.topic?' on':'')+'" data-act="q-topic" data-t="'+t.id+'" style="--bm:'+topicCol(t.id)+'" aria-pressed="'+(t.id===q.topic)+'">'+esc(t.name)+'</button>').join('')}
function closeQ(){$('#qBack').hidden=true;$('#qsheet').hidden=true;q=null}
function saveQ(){
  if(!q)return;
  const text=$('#qText').value.replace(/\s+$/,''),blocks=text.split('\n').map(x=>({t:'p',x}));
  if(q.id){const d=get(q.id);if(d){
    if(!text.trim()){trashDoc(d.id);const id=d.id;toast('쓰레기통에 버렸어요','되돌리기',()=>restore(id))}
    else if(text!==noteText(d)||q.topic!==topicOf(d))put({...d,blocks,topic:q.topic});
  }}
  else if(text.trim())put(newDoc({place:'stack',topic:q.topic,blocks}));
  if(panel&&panel.place==='stack')panel.topic=q.topic;
  closeQ();renderPanel(true);
}

/* ================= editor ================= */
let cur=null,edStack=[],lastIdx=0,uploading=0,kidsPending=false,freshId=null;
function openEditor(id,o={}){
  const d=get(id);if(!d)return;
  if(cur&&o.push){flushNow(cur.id);edStack.push(cur.id)}
  cur=JSON.parse(JSON.stringify(d));
  if(!Array.isArray(cur.blocks)||!cur.blocks.length)cur.blocks=[{t:'p',x:''}];
  if(!Array.isArray(cur.photos))cur.photos=[];
  lastIdx=0;show('#editor');renderEditor();$('#editor').scrollTop=0;
  if(o.focus==='title')$('#edTitle').focus();
  if(o.flashKid)requestAnimationFrame(()=>{const b=$('.nbox[data-kid="'+o.flashKid+'"]');if(b){b.scrollIntoView({block:'center'});b.classList.add('flash');setTimeout(()=>b.classList.remove('flash'),1400)}});
}
function renderEditor(){if(!cur)return;renderHead();const t=$('#edTitle');t.value=cur.title||'';size(t);renderPhotos();renderBlocks();renderKids(true)}
const PIC={stack:'<path d="M5 5h10a3 3 0 0 1 3 3v11H8a3 3 0 0 1-3-3Z"/><path d="M5 16a3 3 0 0 1 3-3h10"/>',drawer:'<rect x="5" y="4" width="14" height="16" rx="2"/><path d="M5 12h14M11 8h2M11 16h2"/>',box:'<path d="M4 9l8-4 8 4v9l-8 3-8-3Z"/><path d="M4 9l8 4 8-4M12 13v8"/>',board:'<rect x="4" y="5" width="16" height="13" rx="2"/><path d="M9 9h6"/>',trash:'<path d="M6 8h12l-1 12H7Z"/><path d="M5 8h14M10 5h4"/>'};
function renderHead(){
  if(!cur)return;
  $('#edChip').innerHTML='<span class="dot"><svg viewBox="0 0 24 24">'+(PIC[cur.place]||PIC.box)+'</svg></span>'+esc(placeLabel(cur))+'<svg viewBox="0 0 24 24"><path d="m7 10 5 5 5-5"/></svg>';
  $('#edChip').setAttribute('aria-label','위치: '+placeLabel(cur)+'. 눌러서 옮기기');
  const r=$('#edRight');
  if(cur.place==='trash'){r.textContent='다시 꺼내기';r.dataset.act='ed-restore';r.className='btn'}
  else{r.textContent='버리기';r.dataset.act='ed-trash';r.className='btn ghost danger'}
  const cr=$('#edCrumb'),p=cur.parent&&get(cur.parent);
  if(p&&p.place===cur.place){cr.hidden=false;cr.textContent='‘'+(titleOf(p)||'제목 없음')+'’의 생각 조각'}else cr.hidden=true;
  $('#toolPh').hidden=!canPhoto();
  const cb=$('#cornerBtn');cb.hidden=!(cur.place==='drawer'&&!isKid(cur));cb.textContent=cur.corner?'앞으로 꺼내기':'서랍 구석으로';
}
function saveCur(delay=500){if(cur)put(JSON.parse(JSON.stringify(cur)),delay)}
function size(el){el.style.height='auto';el.style.height=el.scrollHeight+'px'}
function renderPhotos(){
  const el=$('#edPhotos');if(!cur)return;const can=canPhoto();
  let h=cur.photos.map((p,i)=>'<button class="ph" data-act="ph-view" data-i="'+i+'" aria-label="사진 '+(i+1)+' 크게 보기"><img src="'+esc(srcOf(p))+'" alt=""></button>').join('');
  for(let i=0;i<uploading;i++)h+='<div class="ph busy">올리는 중…</div>';
  if(can)h+='<button class="ph add" data-act="tool-ph">+ 사진</button>';
  el.innerHTML=h;
  el.hidden=!(cur.photos.length||uploading||(cur.place==='board'&&can));
}
/* numbers keep counting through the memo; a divider starts over; b.s fixes a start number */
function numAt(i){let n=0;for(let j=0;j<=i&&j<cur.blocks.length;j++){const b=cur.blocks[j];if(b.t==='hr')n=0;else if(b.t==='n')n=(b.s>0)?b.s:n+1}return n}
function renderBlocks(fi,caret){
  const wrap=$('#edBlocks');wrap.innerHTML='';let n=0;
  cur.blocks.forEach((b,i)=>{
    if(b.t==='hr'){
      n=0;const row=document.createElement('div');row.className='blk hr-row';
      const hr=document.createElement('button');hr.type='button';hr.className='hr';hr.setAttribute('aria-label','구분선. 두 번 누르면 지워져요');
      hr.addEventListener('click',()=>{
        if(hr.classList.contains('armed')){cur.blocks.splice(i,1);if(!cur.blocks.length)cur.blocks.push({t:'p',x:''});saveCur();renderBlocks(Math.max(0,i-1))}
        else{hr.classList.add('armed');toast('한 번 더 누르면 구분선이 지워져요');setTimeout(()=>hr.classList.remove('armed'),2500)}
      });
      row.appendChild(hr);wrap.appendChild(row);return;
    }
    if(b.t==='n')n=(b.s>0)?b.s:n+1;
    const row=document.createElement('div');row.className='blk t-'+b.t+(b.t==='c'&&b.d?' done':'');
    if(b.t==='c'){const cb=document.createElement('button');cb.type='button';cb.className='cbox';cb.setAttribute('role','checkbox');cb.setAttribute('aria-checked',b.d?'true':'false');cb.setAttribute('aria-label','완료 표시');
      cb.addEventListener('click',()=>{b.d=!b.d;saveCur(300);renderBlocks()});row.appendChild(cb)}
    else if(b.t==='n'){const s=document.createElement('button');s.type='button';s.className='numk';s.textContent=n+'.';
      s.setAttribute('aria-label',n+'번. 눌러서 1부터 다시 세기 또는 이어 세기');
      s.addEventListener('click',()=>{if(b.s>0){delete b.s;toast('앞 번호에 이어서 세요')}else{b.s=1;toast('여기서 1부터 다시 세요')}saveCur();renderBlocks(i)});
      row.appendChild(s)}
    else if(b.t==='b'){const s=document.createElement('span');s.className='bul';s.textContent='•';s.setAttribute('aria-hidden','true');row.appendChild(s)}
    const ta=document.createElement('textarea');ta.id='blk-'+i;ta.className='bt';ta.rows=1;ta.value=b.x||'';
    ta.setAttribute('aria-label',(i+1)+'번째 줄');
    if(cur.blocks.length===1&&!b.x)ta.placeholder='내용을 적어 보세요';
    ta.addEventListener('input',()=>onBlockInput(i,ta));
    ta.addEventListener('keydown',e=>onBlockKey(e,i,ta));
    ta.addEventListener('focus',()=>{lastIdx=i});
    row.appendChild(ta);wrap.appendChild(row);
  });
  wrap.querySelectorAll('.bt').forEach(size);
  if(fi!=null)focusBlock(fi,caret);
}
function focusBlock(i,pos){
  let ta=$('#blk-'+i);
  if(!ta){for(let j=i;j<cur.blocks.length&&!ta;j++)ta=$('#blk-'+j);for(let j=i;j>=0&&!ta;j--)ta=$('#blk-'+j)}
  if(!ta)return;ta.focus();const p=pos==null?ta.value.length:Math.min(pos,ta.value.length);ta.setSelectionRange(p,p);lastIdx=+ta.id.slice(4);
}
function onBlockInput(i,ta){
  const b=cur.blocks[i],v=ta.value;
  if(v.includes('\n')){
    const parts=v.split('\n');
    if(b.t!=='p'&&parts.length===2&&!parts[0].trim()&&!parts[1]){b.t='p';delete b.d;delete b.s;b.x='';saveCur();renderBlocks(i,0);return}
    b.x=parts[0];
    const add=parts.slice(1).map(x=>b.t==='c'?{t:'c',x,d:false}:{t:b.t,x});
    cur.blocks.splice(i+1,0,...add);saveCur();
    const last=add[add.length-1];renderBlocks(i+add.length,parts.length===2?0:last.x.length);return;
  }
  /* shortcuts typed at the start of a plain line: "3. " numbers from 3, "- " makes a dot, "[] " a checkbox */
  if(b.t==='p'){
    let m;
    if((m=v.match(/^(\d{1,3})[.)] /))){
      b.t='n';b.x=v.slice(m[0].length);const want=+m[1];delete b.s;
      cur.blocks[i]=b;if(numAt(i)!==want)b.s=want;
      saveCur();renderBlocks(i,0);return;
    }
    if((m=v.match(/^[-*•] /))){b.t='b';b.x=v.slice(2);saveCur();renderBlocks(i,0);return}
    if((m=v.match(/^\[ ?\] /))){b.t='c';b.d=false;b.x=v.slice(m[0].length);saveCur();renderBlocks(i,0);return}
  }
  b.x=v;size(ta);saveCur();
}
function onBlockKey(e,i,ta){
  if(e.key!=='Backspace'||e.isComposing||ta.selectionStart!==0||ta.selectionEnd!==0)return;
  const b=cur.blocks[i];
  if(b.t!=='p'){e.preventDefault();b.t='p';delete b.d;delete b.s;saveCur();renderBlocks(i,0);return}
  if(i>0&&cur.blocks[i-1].t==='hr'){e.preventDefault();cur.blocks.splice(i-1,1);saveCur();renderBlocks(i-1,0);return}
  if(i>0){e.preventDefault();const prev=cur.blocks[i-1],pos=(prev.x||'').length;prev.x=(prev.x||'')+(b.x||'');cur.blocks.splice(i,1);saveCur();renderBlocks(i-1,pos)}
}
function toggleType(t){
  if(!cur)return;let i=Math.min(lastIdx,cur.blocks.length-1);if(cur.blocks[i].t==='hr')i=Math.max(0,i-1);
  const b=cur.blocks[i];if(b.t==='hr')return;const ta=$('#blk-'+i),pos=ta?ta.selectionStart:(b.x||'').length;
  if(b.t===t){b.t='p';delete b.d;delete b.s}else{b.t=t;delete b.s;if(t==='c')b.d=false;else delete b.d}
  saveCur();renderBlocks(i,pos);
}
function insertHr(){
  if(!cur)return;const i=Math.min(lastIdx,cur.blocks.length-1),b=cur.blocks[i];
  if(b.t==='p'&&!(b.x||'').trim()){cur.blocks.splice(i,1,{t:'hr'},{t:'p',x:''});saveCur();renderBlocks(i+1,0)}
  else{cur.blocks.splice(i+1,0,{t:'hr'},{t:'p',x:''});saveCur();renderBlocks(i+2,0)}
}

/* photos */
let pickTarget='editor';
async function shrink(file,max,q,asData){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
    const w=img.naturalWidth,h=img.naturalHeight,k=Math.min(1,max/Math.max(w,h));
    const c=document.createElement('canvas');c.width=Math.max(1,Math.round(w*k));c.height=Math.max(1,Math.round(h*k));
    const x=c.getContext('2d');x.fillStyle='#ffffff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);
    if(asData)return c.toDataURL('image/jpeg',q);
    return await new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error('blob')),'image/jpeg',q));
  }finally{URL.revokeObjectURL(url)}
}
async function uploadOne(file){
  if(mode==='cloud'){const blob=await shrink(file,1600,.85,false);const path=me+'/'+uid()+'.jpg';
    const {error}=await sb.storage.from('photos').upload(path,blob,{contentType:'image/jpeg',upsert:false});if(error)throw error;return path}
  return await shrink(file,900,.72,true);
}
function upErr(e){const c=e&&e.code;toast(c==='too_large'?'사진이 너무 커요.':c==='quota_or_state'?'사진 저장 공간이 꽉 찼어요.':c==='rate_limited'?'잠시 뒤 다시 올려 주세요.':'사진을 올리지 못했어요. 다시 시도해 주세요.')}
async function addPhotos(files){
  if(!cur)return;const id=cur.id;
  for(const file of files){
    uploading++;renderPhotos();
    let ref=null;try{ref=await uploadOne(file)}catch(e){upErr(e)}
    uploading--;
    if(ref){
      if(cur&&cur.id===id){cur.photos.push(ref);saveCur(0)}
      else{const d=get(id);if(d)put({...d,photos:[...(d.photos||[]),ref]})}
    }
    if(cur&&cur.id===id)renderPhotos();
  }
}
async function boardAdd(files){
  const made=files.map((file,i)=>{const d=put(newDoc({place:'board',created:now()+i}));boardBusy.add(d.id);return [d.id,file]});
  renderPanel(true);
  for(const [id,file] of made){
    let ref=null;try{ref=await uploadOne(file)}catch(e){upErr(e)}
    boardBusy.delete(id);const d=get(id);if(!d)continue;
    if(ref)put({...d,photos:[...(d.photos||[]),ref]});else if(isEmpty(d))del(id);

}
